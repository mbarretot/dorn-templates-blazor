name: build-test

on:
  workflow_call:

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  validate-template-json:
    name: validate-template-json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack templates
        run: |
          dotnet pack eng/packaging/Dorn.Templates.BlazorServer/Dorn.Templates.BlazorServer.csproj -c Release -p:PackageVersion=0.0.1-ci-validate -o /tmp/template-validate
          dotnet pack eng/packaging/Dorn.Templates.BlazorWasm/Dorn.Templates.BlazorWasm.csproj -c Release -p:PackageVersion=0.0.1-ci-validate -o /tmp/template-validate

      - name: Install templates
        run: |
          dotnet new install /tmp/template-validate/Dorn.Templates.BlazorServer.0.0.1-ci-validate.nupkg
          dotnet new install /tmp/template-validate/Dorn.Templates.BlazorWasm.0.0.1-ci-validate.nupkg

      # --dry-run resolves symbols/sources and lists what would be created without writing
      # anything or running restore/build, so a malformed template.json fails here in seconds
      # instead of waiting on a full generate-and-build cycle.
      - name: Dry-run generate (server)
        run: dotnet new dorn-blazor-server -n CiValidateServerApp -o /tmp/template-validate/server --dry-run

      - name: Dry-run generate (wasm)
        run: dotnet new dorn-blazor-wasm -n CiValidateWasmApp -o /tmp/template-validate/wasm --dry-run

  dev-loop-tests:
    name: dev-loop-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Test blazor-wasm template's own tiers
        run: dotnet test templates/blazor/wasm/CleanArchBlazorWasm.slnx -c Release

      - name: Test blazor-server template's own tiers
        run: dotnet test templates/blazor/server/CleanArchBlazorServer.slnx -c Release

  template-generation-tests:
    name: template-generation-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore DornTemplatesBlazor.slnx

      - name: Build
        run: dotnet build DornTemplatesBlazor.slnx --no-restore -c Release

      - name: Test template generation matrix
        run: dotnet test tests/Dorn.Templates.Blazor.Tests/Dorn.Templates.Blazor.Tests.csproj --no-build -c Release

  browser-e2e-tests:
    name: browser-e2e-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore DornTemplatesBlazor.slnx

      - name: Build
        run: dotnet build DornTemplatesBlazor.slnx --no-restore -c Release

      - name: Install Playwright browsers
        run: pwsh tests/Dorn.Templates.Blazor.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test browser quality suite
        run: dotnet test tests/Dorn.Templates.Blazor.BrowserTests/Dorn.Templates.Blazor.BrowserTests.csproj --no-build -c Release
