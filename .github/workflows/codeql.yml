name: codeql

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: "Build (repo: eng/packaging, tests)"
        run: dotnet build DornTemplatesBlazor.slnx -c Release

      - name: Build (blazor-server template)
        run: dotnet build templates/blazor/server/CleanArchBlazorServer.slnx -c Release

      - name: Build (blazor-wasm template)
        run: dotnet build templates/blazor/wasm/CleanArchBlazorWasm.slnx -c Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
